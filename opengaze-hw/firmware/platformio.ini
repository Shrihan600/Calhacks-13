; OpenGaze ESP32-CAM firmware. One codebase, two roles (left / right) + I2C scanner tool.
; Uses pioarduino (Arduino-ESP32 core 3.x). Code is written against the 3.x camera API
; (pin_sccb_sda/pin_sccb_scl). Do NOT switch to the stock espressif32 platform (core 2.x).
[platformio]
default_envs = left

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -I include

[env:left]
build_flags = ${env.build_flags} -DROLE_LEFT

[env:right]
build_flags = ${env.build_flags} -DROLE_RIGHT

; Stand-alone I2C scanner + MPU-6050 diagnostic (no camera, no Wi-Fi)
[env:i2c_scan]
build_flags = ${env.build_flags} -DROLE_LEFT -DTOOL_I2C_SCAN

; ---- WIRED mode: no Wi-Fi. Frames + IMU go over the camera's UART0 to a USB-serial bridge
; ---- (Arduino Uno/Nano with RESET->GND works as the bridge). Tune with the -D flags below.
[env:left_serial]
build_flags = ${env.build_flags} -DROLE_LEFT -DTRANSPORT_SERIAL -DSERIAL_BAUD=921600 -DSERIAL_JPEG_QUALITY=18 -DSERIAL_FPS_LIMIT=20

[env:right_serial]
build_flags = ${env.build_flags} -DROLE_RIGHT -DTRANSPORT_SERIAL -DSERIAL_BAUD=921600 -DSERIAL_JPEG_QUALITY=18 -DSERIAL_FPS_LIMIT=20

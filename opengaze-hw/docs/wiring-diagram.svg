<text x="1325.0" y="897" font-size="11.5" text-anchor="middle" fill="#666">Ignore the round pads in the middle.</text>
<text x="30" y="940" font-size="13.5" fill="#333">VBUS is this board's 5 V pin (5 V from the USB-C port). The XIAO is a 3.3 V board, so it connects straight to the camera (no resistor divider). Its current limit is unverified:</text>
<text x="30" y="962" font-size="13.5" fill="#333">the camera needs about 250 mA. If a camera resets, power it from a separate 5 V supply and share only ground. Never connect two 5 V sources to one camera.</text>
<text x="30" y="984" font-size="13.5" fill="#333">To flash a camera: also connect the dashed wires, then run  pio run -e left_serial -t upload  (or right_serial), using that XIAO's port.</text>
<text x="30" y="1006" font-size="13.5" fill="#333">Each XIAO appears on the Mac as its own /dev/cu.usbmodem… port. Untested on hardware.</text>
